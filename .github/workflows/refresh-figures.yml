name: Refresh portfolio figures

# Publish the real Matplotlib outputs into the repository,
# so README previews are generated by the same code used in analysis.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-figures.yml'
      - 'scripts/build_figures.py'
      - 'scripts/compare_published_county_ratios.py'
      - 'reports/*.csv'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-figures-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python requirements
        run: python -m pip install -r requirements.txt
      - name: Validate aggregates and regenerate figures
        env:
          MPLBACKEND: Agg
          SOURCE_DATE_EPOCH: '1793232000'
        run: |
          python -m pytest -q
          python scripts/build_figures.py --from-summaries
          python scripts/compare_published_county_ratios.py --from-summary
      - name: Commit generated SVG previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figures/*.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Regenerate portfolio SVGs using Matplotlib'
            git push
          else
            echo 'Tracked SVG charts already match the plotting script.'
          fi
