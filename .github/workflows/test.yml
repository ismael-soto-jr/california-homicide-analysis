name: Test data preparation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic regression tests
        run: python -m pytest -q
      - name: Reproduce portfolio figures from tracked summaries
        env:
          MPLBACKEND: Agg
        run: python scripts/build_figures.py --from-summaries
