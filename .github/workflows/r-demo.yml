name: Test R population-adjusted demo

on:
  push:
    paths:
      - "R/**"
      - "reports/doj_published_table14_county_year.csv"
      - "reports/published_county_pooled_2018_2022.csv"
      - ".github/workflows/r-demo.yml"
  pull_request:
    paths:
      - "R/**"
      - "reports/doj_published_table14_county_year.csv"
      - "reports/published_county_pooled_2018_2022.csv"
      - ".github/workflows/r-demo.yml"
  workflow_dispatch:

jobs:
  r-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install dependencies
        run: Rscript -e 'install.packages(c("dplyr", "readr", "ggplot2"), repos="https://cloud.r-project.org")'
      - name: Test with invented data
        run: Rscript R/tests/test_pooled_count_ratio_demo.R
      - name: Recompute audited pooled ratios and render figure
        run: Rscript R/pooled_count_ratio_demo.R
